name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate demo
        shell: pwsh
        run: .\scripts\validate.ps1 -SkipNpmInstall

      - name: Upload self-contained dashboard
        uses: actions/upload-artifact@v4
        with:
          name: specforge-dashboard
          path: dashboard/dist-single/index.html
          if-no-files-found: error
